<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a saved light/dark choice before first paint. Same key and values as theme.ts. -->
    <script>
      try {
        const scheme = localStorage.getItem("renovate-report-html:color-scheme");
        if (scheme === "light" || scheme === "dark") document.querySelector('meta[name="color-scheme"]').content = scheme;
      } catch {}
    </script>
    <meta name="text-scale" content="scale" />
    <meta name="generator" content="renovate-report-html" />
    <title>Renovate report</title>
  </head>
  <body>
    <div id="app"></div>
    <script id="report-data" type="application/json">__RENOVATE_REPORT_DATA__</script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
