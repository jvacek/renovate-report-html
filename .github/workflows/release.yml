# Publishes to npm when a version tag is pushed: `npm version minor && git push --follow-tags`.
# Uses npm trusted publishing (OIDC): no npm token, provenance is attached automatically.
# One-time setup is in RELEASING.md. The npm settings name this file, so don't rename it.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: pnpm test
      # `npm pack` runs the prepack script, which builds the viewer and the CLI.
      - run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: renovate-report-html-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each release before it goes out.
    environment:
      name: npm
      url: https://www.npmjs.com/package/renovate-report-html
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Publishes exactly the tarball built and tested above; no install or build here.
      # Skips a version that is already on npm (the first, manual release, or a re-run).
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if npm view "renovate-report-html@${TAG#v}" version > /dev/null 2>&1; then
            echo "::notice::renovate-report-html@${TAG#v} is already on npm, skipping publish"
          else
            npm publish renovate-report-html-*.tgz
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" renovate-report-html-*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
